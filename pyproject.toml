[project]
name = "lead-intelligence-mcp"
version = "0.1.0"
description = "MCP Server para score de email"
authors = [
    {name = "Matheus Adam"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mcp[httpx] (>=2.1.1,<3.0.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "langgraph (>=1.2.11,<2.0.0)",
    "langchain-openai (>=1.6.0,<2.0.0)",
    "arize-phoenix (>=20.7.0,<21.0.0)",
    "openinference-instrumentation-langchain (>=0.1.73,<0.2.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-playwright (>=0.9.0,<0.10.0)",
    "deepeval (>=4.2.1,<5.0.0)"
]
